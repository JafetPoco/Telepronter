<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teleprompter - Control Profesional</title>
    <link rel="stylesheet" href="control.css">
</head>
<body>
    <div class="app-container">
        <!-- Header con gradiente -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🎤</span>
                    <h1>Teleprompter<span class="light">Pro</span></h1>
                </div>
                <div class="connection-badge" id="connectionStatus">
                    <div class="status-dot"></div>
                    <span>Conectando...</span>
                </div>
            </div>
        </header>

        <!-- Panel de control principal -->
        <div class="main-content">
            <!-- Tarjeta de estado actual -->
            <div class="status-card">
                <div class="card-header">
                    <span class="card-icon">📺</span>
                    <h3>Ahora en pantalla</h3>
                </div>
                <div class="song-info">
                    <div class="song-title" id="currentSong">
                        <span class="label">Canción:</span>
                        <span class="value">Cargando...</span>
                    </div>
                    <div class="current-line-container">
                        <span class="label">Línea actual:</span>
                        <div class="current-line-wrapper">
                            <span class="quote">"</span>
                            <span class="current-line" id="currentLine">-</span>
                            <span class="quote">"</span>
                        </div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-info">
                            <span class="progress-text" id="progress">Progreso</span>
                            <span class="percentage" id="percentage">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de control principales -->
            <div class="controls-card">
                <div class="card-header">
                    <span class="card-icon">🎮</span>
                    <h3>Control de navegación</h3>
                </div>
                <div class="button-grid">
                    <button class="control-btn prev-btn" id="btnPrev">
                        <span class="btn-icon">◀</span>
                        <span class="btn-label">Anterior</span>
                        <span class="btn-shortcut">←</span>
                    </button>
                    <button class="control-btn next-btn" id="btnNext">
                        <span class="btn-icon">▶</span>
                        <span class="btn-label">Siguiente</span>
                        <span class="btn-shortcut">→</span>
                    </button>
                    <button class="control-btn chorus-btn" id="btnCoro">
                        <span class="btn-icon">🎵</span>
                        <span class="btn-label">Ir al coro</span>
                        <span class="btn-shortcut">C</span>
                    </button>
                    <button class="control-btn reset-btn" id="btnReset">
                        <span class="btn-icon">⟳</span>
                        <span class="btn-label">Reiniciar</span>
                        <span class="btn-shortcut">R</span>
                    </button>
                </div>
            </div>

            <!-- Lista de canciones -->
            <div class="songs-card">
                <div class="card-header">
                    <span class="card-icon">📋</span>
                    <h3>Biblioteca</h3>
                    <span class="song-count" id="songCount">0 canciones</span>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchSongs" placeholder="Buscar canción..." class="search-input">
                </div>
                <div class="song-list" id="songList">
                    <div class="loading-skeleton">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="control.js"></script>
</body>
</html>
