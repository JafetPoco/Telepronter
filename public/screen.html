<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teleprompter - Pantalla</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #000;
        }

        /* Video de fondo */
        #video-bg {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Capa oscura para mejorar legibilidad */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Contenedor de la letra */
        .lyric-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .lyric-text {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7);
            max-width: 90%;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            line-height: 1.4;
            animation: fadeSlideUp 0.5s ease-out;
        }

        /* Animación de entrada */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Info de canción */
        .song-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 20px;
            font-family: monospace;
        }

        /* Mensaje de conexión */
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .lyric-text {
                font-size: 2rem;
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .lyric-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <video id="video-bg" autoplay muted loop>
        <source src="/videos/fondo.mp4" type="video/mp4">
        Tu navegador no soporta video de fondo.
    </video>
    <div class="overlay"></div>
    
    <div class="lyric-container">
        <div class="lyric-text" id="lyricDisplay">Cargando...</div>
    </div>
    
    <div class="song-info" id="songInfo"></div>
    <div class="connection-status" id="connectionStatus">Conectando...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let canciones = [];

        // Elementos DOM
        const lyricDisplay = document.getElementById('lyricDisplay');
        const songInfo = document.getElementById('songInfo');
        const connectionStatus = document.getElementById('connectionStatus');

        // Estado inicial
        socket.on('estado-inicial', (estado) => {
            canciones = estado.canciones;
            actualizarPantalla(estado);
            connectionStatus.textContent = '✅ Conectado';
            connectionStatus.style.color = 'rgba(100, 255, 100, 0.8)';
        });

        // Actualización desde el control
        socket.on('actualizar-estado', (estado) => {
            actualizarPantalla(estado);
        });

        function actualizarPantalla(estado) {
            const cancion = estado.canciones[estado.cancionActual];
            const linea = cancion.letra[estado.lineaActual];
            
            lyricDisplay.textContent = linea;
            songInfo.textContent = `${cancion.titulo} • ${estado.lineaActual + 1}/${cancion.letra.length}`;
            
            // Reanimar efecto
            lyricDisplay.style.animation = 'none';
            lyricDisplay.offsetHeight; // Forzar reflow
            lyricDisplay.style.animation = 'fadeSlideUp 0.5s ease-out';
        }

        // Manejo de desconexión
        socket.on('disconnect', () => {
            connectionStatus.textContent = '⚠️ Desconectado';
            connectionStatus.style.color = 'rgba(255, 100, 100, 0.8)';
            lyricDisplay.textContent = 'Esperando conexión...';
        });

        socket.on('connect', () => {
            connectionStatus.textContent = '✅ Conectado';
            connectionStatus.style.color = 'rgba(100, 255, 100, 0.8)';
        });
    </script>
</body>
</html>
