<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Teleprompter - Pantalla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,700,50,1;1,9..144,700,50,1&family=Viaoda+Libre&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/screen.css" rel="stylesheet">
</head>

<body class="bg-slate-900 min-h-screen overflow-hidden antialiased">

  <!-- VIDEO DE FONDO -->
  <video id="video-bg" autoplay muted loop playsinline>
    <source src="/videos/fondo.mp4" type="video/mp4">
    Tu navegador no soporta video de fondo.
  </video>
  
  <!-- OVERLAY OSCURO -->
  <div class="overlay bg-gradient-to-b from-slate-950/30 via-slate-900/10 to-slate-950/30"></div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-8">
    
    <!-- VISTA PRINCIPAL (imagen) -->
    <div id="mainView" class="main-view flex items-center justify-center w-full h-full">
      <img class="main-image" src="/videos/principal.png" alt="Vista principal del teleprompter">
    </div>

    <!-- CONTENEDOR DE LETRAS -->
    <div id="lyricContainer" class="lyric-container w-full max-w-6xl mx-auto rounded-3xl px-2  py-8 text-center">
      <div id="lyricDisplay" class="lyric-text font-bold tracking-wide
            bg-gradient-to-r
            from-[#B52B43]
            via-[#64101F]
            to-[#B52B43]
            bg-clip-text
            text-transparent">
        Cargando...
      </div>
    </div>

    <!-- INFO DE LA CANCIÓN (abajo, sutil) -->
    <div id="songInfo" class="fixed bottom-6 left-1/2 -translate-x-1/2 text-center text-slate-400/60 text-sm font-medium tracking-wider uppercase">
      Esperando canción...
    </div>

    <!-- ESTADO DE CONEXIÓN (esquina superior derecha) -->
    <div id="connectionStatus" class="status-indicator fixed top-4 right-4" aria-label="Conectado">
      <span class="status-dot" aria-hidden="true"></span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="screen.js"></script>

</body>
</html>
