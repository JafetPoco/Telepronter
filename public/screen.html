<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teleprompter - Pantalla</title>
    <link rel="stylesheet" href="screen.css">
  </head>
  <body>
    <video id="video-bg" autoplay muted loop>
      <source src="/videos/fondo.mp4" type="video/mp4">
      Tu navegador no soporta video de fondo.
    </video>
    <div class="overlay"></div>

    <div class="lyric-container">
      <div class="lyric-text" id="lyricDisplay">Cargando...</div>
    </div>

    <div class="song-info" id="songInfo"></div>
    <div class="connection-status" id="connectionStatus">Conectando...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="screen.js"></script>

  </body>
</html>
